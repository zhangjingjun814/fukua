<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>留言反馈 · 浮夸 | 专题网站</title>
  <meta
    name="description"
    content="给《浮夸》专题网站留言：前端表单验证演示，无后端、不会真正发送邮件。"
  />
  <meta property="og:title" content="留言反馈 · 浮夸" />
  <meta property="og:description" content="带无障碍验证的联系表单。" />
  <meta property="og:type" content="website" />

  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
        var theme = saved || (prefersLight ? "light" : "dark");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="site-header">
    <nav class="container nav-wrapper" aria-label="主导航">
      <a class="brand" href="index.html">浮<span>夸</span></a>

      <ul class="nav-list" id="nav-list">
        <li><a href="index.html">首页</a></li>
        <li><a href="about.html">歌曲档案</a></li>
        <li><a href="analysis.html">主题解析</a></li>
        <li><a href="impact.html">影响传唱</a></li>
        <li><a href="contact.html" aria-current="page">留言反馈</a></li>
      </ul>

      <div class="nav-actions">
        <button class="icon-btn" type="button" data-theme-toggle>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" hidden>
            <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z" />
          </svg>
        </button>

        <button class="icon-btn nav-toggle" type="button" data-nav-toggle
          aria-expanded="false" aria-controls="nav-list" aria-label="打开导航菜单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>
      </div>
    </nav>
  </header>

  <main id="main">
    <div class="page-head container">
      <p class="kicker">Contact</p>
      <h1>留言反馈</h1>
      <p>告诉我你对这个网站或这首歌的想法。</p>
    </div>

    <section class="section--tight container">
      <div class="cards">
        <form class="form" data-contact-form novalidate>
          <div class="form-row">
            <label for="name">姓名</label>
            <input type="text" id="name" name="name" autocomplete="name"
              required aria-describedby="name-error" />
            <p class="field-error" id="name-error" aria-live="polite"></p>
          </div>

          <div class="form-row">
            <label for="email">邮箱</label>
            <input type="email" id="email" name="email" autocomplete="email"
              required aria-describedby="email-error" />
            <p class="field-error" id="email-error" aria-live="polite"></p>
          </div>

          <div class="form-row">
            <label for="message">留言</label>
            <textarea id="message" name="message" required
              aria-describedby="message-error"></textarea>
            <p class="field-error" id="message-error" aria-live="polite"></p>
          </div>

          <button class="btn btn--primary" type="submit">提交留言</button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>

        <div class="card">
          <h2>说明</h2>
          <p>
            这是一个课程学习项目，表单只在浏览器里做前端验证，
            <strong>没有后端服务器，也不会真正发送邮件</strong>。
          </p>
          <p>
            提交时 JavaScript 会检查姓名、邮箱格式和留言长度，
            并通过无障碍方式提示错误，这正是课程中
            “DOM、事件与表单验证”的实践。
          </p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div>
        <p><strong>《浮夸》学习专题网站</strong></p>
        <p>本网站为课程学习项目，非官方粉丝站点，与歌手及唱片公司无关。</p>
      </div>
      <div>
        <p>歌曲与歌词版权归原作者及相关权利人所有。</p>
        <p>© 2026 学生作业 · 仅供学习使用</p>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
